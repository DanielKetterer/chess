name: Analyze Daily Chess Games

on:
  workflow_dispatch:
    inputs:
      username:
        description: Chess.com username
        required: true
        default: DanielKetterer
        type: string
      date:
        description: Local YYYY-MM-DD to scan; leave blank for yesterday
        required: false
        default: ""
        type: string
      timezone:
        description: >-
          IANA timezone. Decides both which local day is scanned and which
          reports/YYYY/MM/DD folder the reports land in.
        required: false
        default: America/New_York
        type: string
  schedule:
    # Runs at 3am America/New_York during daylight-saving time.
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: daily-chess-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-daily:
    name: Analyze unreported games
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stockfish 18
        run: |
          release_api="https://api.github.com/repos/official-stockfish/Stockfish/releases/tags/sf_18"
          curl -fsSL "$release_api" -o /tmp/stockfish-release.json
          asset_url=$(python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("/tmp/stockfish-release.json").read_text())
          for asset in release["assets"]:
              name = asset["name"]
              if "ubuntu" in name and "x86-64-avx2" in name and name.endswith(".tar"):
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("Stockfish 18 Ubuntu x86-64 AVX2 asset not found")
          PY
          )
          curl -fsSL "$asset_url" -o /tmp/stockfish.tar
          mkdir -p /tmp/stockfish
          tar -xf /tmp/stockfish.tar -C /tmp/stockfish
          stockfish_bin=$(find /tmp/stockfish -type f -name 'stockfish*' -perm -111 | head -n 1)
          sudo install -m 0755 "$stockfish_bin" /usr/local/bin/stockfish
          echo quit | /usr/local/bin/stockfish

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-chess pandas matplotlib

      - name: Find unanalyzed games
        env:
          USERNAME: ${{ inputs.username || 'DanielKetterer' }}
          LOCAL_DATE: ${{ inputs.date }}
          REPORT_TZ: ${{ inputs.timezone || 'America/New_York' }}
        run: |
          set -euo pipefail
          # unanalyzed_games.py must walk reports/ recursively now that reports
          # live in dated subfolders. A non-recursive glob here silently finds
          # nothing already analyzed and re-runs Stockfish on the whole archive.
          mkdir -p reports
          args=(--username "$USERNAME" --timezone "$REPORT_TZ" --reports-dir reports)
          if [ -n "$LOCAL_DATE" ]; then
            args+=(--date "$LOCAL_DATE")
          fi
          python unanalyzed_games.py "${args[@]}" > games_to_analyze.txt
          cat games_to_analyze.txt

      - name: Analyze games
        env:
          STOCKFISH_PATH: /usr/local/bin/stockfish
          USERNAME: ${{ inputs.username || 'DanielKetterer' }}
          REPORT_TZ: ${{ inputs.timezone || 'America/New_York' }}
        run: |
          set -euo pipefail
          mkdir -p reports
          while IFS= read -r game_id; do
            [ -n "$game_id" ] || continue
            # The analyzer files each game under reports/YYYY/MM/DD/ itself,
            # keyed on the game's own end time, so re-analyzing a game
            # overwrites its report instead of adding a near-duplicate.
            python chess_analyzer.py \
              --username "$USERNAME" \
              --game-id "$game_id" \
              --depth 24 \
              --findability honest \
              --perspective both \
              --reports-dir reports \
              --reports-timezone "$REPORT_TZ" \
              --puzzles-file puzzles.json
          done < games_to_analyze.txt

      - name: Commit reports to repository
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f games_to_analyze.txt
          git add -f reports/ puzzles.json
          if git diff --cached --quiet; then
            echo "No new daily reports."
            exit 0
          fi
          git commit -m "Add daily chess analyses"
          git pull --rebase -X theirs origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"
