name: Puzzle utilities

on:
  workflow_dispatch:
    inputs:
      mode:
        description: list, render, or complete
        required: true
        default: list
        type: choice
        options: [list, render, complete]
      puzzles_file:
        description: Puzzle JSON path
        required: false
        default: puzzles.json
      puzzle_selector:
        description: Optional puzzle ID or FEN for list/render mode
        required: false
      render_all_unrendered:
        description: Render every puzzle without an existing Markdown card
        required: false
        default: false
        type: boolean
      render_dir:
        description: Root directory for committed rendered puzzle cards
        required: false
        default: rendered-puzzles
      fen:
        description: Puzzle FEN for complete mode
        required: false
      attempted_move:
        description: Optional attempted move for complete mode
        required: false

permissions:
  contents: write

jobs:
  puzzle-utilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-chess
      - name: Run selected puzzle utility
        env:
          MODE: ${{ inputs.mode }}
          PUZZLES_FILE: ${{ inputs.puzzles_file }}
          PUZZLE_SELECTOR: ${{ inputs.puzzle_selector }}
          FEN: ${{ inputs.fen }}
          ATTEMPTED_MOVE: ${{ inputs.attempted_move }}
          RENDER_ALL_UNRENDERED: ${{ inputs.render_all_unrendered }}
          RENDER_DIR: ${{ inputs.render_dir }}
        run: |
          set -euo pipefail
          case "$MODE" in
            list)
              extra=()
              if [ -n "$PUZZLE_SELECTOR" ]; then extra=(--selector "$PUZZLE_SELECTOR"); fi
              python scripts/render_puzzle_md.py --puzzles-file "$PUZZLES_FILE" "${extra[@]}" --out puzzle.md
              cat puzzle.md
              ;;
            render)
              # Cards are filed under <render_dir>/YYYY/MM/DD/<puzzle-id>.md,
              # dated by when the puzzle was generated, so the folder matches
              # the reports/ tree that produced it. One resolver handles both
              # the single-selector and render-everything cases so the two
              # cannot disagree about where a card belongs.
              mkdir -p "$RENDER_DIR"
              python - > /tmp/puzzle_targets.txt <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from scripts.render_puzzle_md import load_puzzles, original_fen, puzzle_id


          def day_dir(puzzle):
              """YYYY/MM/DD from the puzzle's generation time, in UTC.

              Old puzzle records predate date_generated, so fall back to the
              first recorded attempt and then to today. Anything that has
              already been rendered is skipped before this runs, so the
              fallback cannot move an existing card.
              """
              raw = str(puzzle.get("date_generated") or "").strip()
              if not raw:
                  attempts = puzzle.get("attempts") or []
                  first = attempts[0] if attempts else {}
                  raw = str((first or {}).get("attempted_utc") or "").strip()
              try:
                  dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              except ValueError:
                  dt = datetime.now(timezone.utc)
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              dt = dt.astimezone(timezone.utc)
              return f"{dt.year:04d}/{dt.month:02d}/{dt.day:02d}"


          out_dir = Path(os.environ["RENDER_DIR"])
          puzzles = load_puzzles(Path.cwd() / os.environ["PUZZLES_FILE"])

          if os.environ.get("RENDER_ALL_UNRENDERED") == "true":
              # Match on filename at any depth so cards rendered flat before
              # the tree existed still count as rendered.
              existing = {p.name for p in out_dir.rglob("*.md")}
              for puzzle in puzzles:
                  pid = puzzle_id(puzzle)
                  if f"{pid}.md" not in existing:
                      print(f"{day_dir(puzzle)}/{pid}")
          else:
              selector = os.environ.get("PUZZLE_SELECTOR", "").strip()
              if not selector:
                  raise SystemExit(
                      "render mode needs puzzle_selector, or "
                      "render_all_unrendered: true")
              for puzzle in puzzles:
                  if selector in (puzzle_id(puzzle), puzzle.get("id"), original_fen(puzzle)):
                      print(f"{day_dir(puzzle)}/{puzzle_id(puzzle)}")
                      break
              else:
                  raise SystemExit(f"No puzzle matched selector {selector!r}")
          PY
              mapfile -t targets < /tmp/puzzle_targets.txt
              if [ "${#targets[@]}" -eq 0 ]; then
                echo "All puzzles already have rendered Markdown cards under $RENDER_DIR."
                exit 0
              fi

              for target in "${targets[@]}"; do
                [ -n "$target" ] || continue
                mkdir -p "$RENDER_DIR/$(dirname "$target")"
                python scripts/render_puzzle_md.py \
                  --puzzles-file "$PUZZLES_FILE" \
                  --selector "$(basename "$target")" \
                  --any \
                  --out "$RENDER_DIR/$target.md"
                echo "Rendered $RENDER_DIR/$target.md"
              done
              ;;
            complete)
              test -n "$FEN"
              python scripts/mark_puzzle_attempt.py --puzzles-file "$PUZZLES_FILE" --fen "$FEN" --move "$ATTEMPTED_MOVE" --result completed
              ;;
          esac
      - name: Commit puzzle updates
        if: ${{ inputs.mode == 'complete' || inputs.mode == 'render' }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.mode }}" = "complete" ]; then
            git add "${{ inputs.puzzles_file }}"
          else
            git add "${{ inputs.render_dir }}"
          fi
          if git diff --cached --quiet; then
            echo "Puzzle file has not changed."
            exit 0
          fi
          if [ "${{ inputs.mode }}" = "complete" ]; then
            git commit -m "Mark chess puzzle completed"
          else
            git commit -m "Render chess puzzle cards"
          fi
          git pull --rebase -X theirs origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-output
          path: |
            puzzle.md
            ${{ inputs.render_dir }}/
          if-no-files-found: ignore
