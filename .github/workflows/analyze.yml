name: Analyze Chess Game

on:
  workflow_dispatch:
    inputs:
      username:
        description: Chess.com username
        required: true
        default: DanielKetterer
        type: string

      game_id:
        description: Game ID or URL; leave blank for latest game
        required: false
        default: ""
        type: string

      depth:
        description: Stockfish analysis depth
        required: true
        default: "24"
        type: choice
        options:
          - "10"
          - "18"
          - "24"
          - "30"

      findability:
        description: Findability analysis method
        required: true
        default: honest
        type: choice
        options:
          - heuristic
          - honest

      timezone:
        description: >-
          IANA timezone whose calendar day picks the reports/YYYY/MM/DD folder.
          Keep this identical to the daily workflow.
        required: true
        default: America/New_York
        type: string

# Allows the workflow to commit generated reports.
permissions:
  contents: write

# Prevents two analyses from updating the same branch simultaneously.
concurrency:
  group: chess-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Run chess analysis
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stockfish 18
        run: |
          release_api="https://api.github.com/repos/official-stockfish/Stockfish/releases/tags/sf_18"
          curl -fsSL "$release_api" -o /tmp/stockfish-release.json
          asset_url=$(python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("/tmp/stockfish-release.json").read_text())
          for asset in release["assets"]:
              name = asset["name"]
              if "ubuntu" in name and "x86-64-avx2" in name and name.endswith(".tar"):
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("Stockfish 18 Ubuntu x86-64 AVX2 asset not found")
          PY
          )
          curl -fsSL "$asset_url" -o /tmp/stockfish.tar
          mkdir -p /tmp/stockfish
          tar -xf /tmp/stockfish.tar -C /tmp/stockfish
          stockfish_bin=$(find /tmp/stockfish -type f -name 'stockfish*' -perm -111 | head -n 1)
          sudo install -m 0755 "$stockfish_bin" /usr/local/bin/stockfish
          echo quit | /usr/local/bin/stockfish

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-chess pandas matplotlib

      - name: Analyze game
        env:
          STOCKFISH_PATH: /usr/local/bin/stockfish
          USERNAME: ${{ inputs.username }}
          GAME_ID: ${{ inputs.game_id }}
          DEPTH: ${{ inputs.depth }}
          FINDABILITY: ${{ inputs.findability }}
          REPORT_TZ: ${{ inputs.timezone }}
        run: |
          set -euo pipefail

          # chess_analyzer.py creates reports/YYYY/MM/DD itself. The root is
          # created here anyway so the commit step always has a path to stage,
          # and so a fresh fork gets the directory on its first run.
          mkdir -p reports

          # --reports-dir makes the analyzer place its own output at
          # reports/YYYY/MM/DD/<game-id>_<utc-stamp>_<color>.{md,png,json}.
          # It knows the game id and end time; the workflow does not until the
          # run is over, which is why this step used to scrape them back out of
          # the finished Markdown with sed and then mv the files into place.
          args=(
            --username "$USERNAME"
            --depth "$DEPTH"
            --findability "$FINDABILITY"
            --perspective both
            --reports-dir reports
            --reports-timezone "$REPORT_TZ"
            --puzzles-file puzzles.json
          )

          if [ -n "$GAME_ID" ]; then
            args+=(--game-id "$GAME_ID")
          fi

          python chess_analyzer.py "${args[@]}"

      - name: Commit reports to repository
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f reports/ puzzles.json

          if git diff --cached --quiet; then
            echo "Reports have not changed."
            exit 0
          fi

          git commit -m "Add dated chess analysis"

          # Incorporate commits made while Stockfish was running.
          git pull --rebase -X theirs origin "$BRANCH_NAME"

          git push origin "HEAD:$BRANCH_NAME"
